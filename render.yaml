# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service runs the API, oracle and batcher and also serves the web app.
services:
  - type: web
    name: flightradar-fun
    runtime: node
    # Free plan sleeps after 15 min without traffic. Keep it awake with an
    # external ping every 10 min on /api/health (e.g. cron-job.org).
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build -w @flightradar/web
    startCommand: cd apps/server && node --import tsx src/main.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Cardano Preprod testnet (test ADA, no monetary value). For the
      # in-memory demo instead, add DEMO=1 and drop the three secrets below.
      - key: NETWORK
        value: Preprod
      # Operator wallet: create with `npm run keygen -w @flightradar/server`,
      # fund at the Preprod faucet, paste the seed in the Render dashboard.
      - key: OPERATOR_SEED
        sync: false
      # Optional; without it the server uses Koios.
      - key: BLOCKFROST_PROJECT_ID
        sync: false
      # Optional free Koios token (koios.rest): 50,000 instead of 5,000
      # chain queries a day. Not needed with Blockfrost.
      - key: KOIOS_TOKEN
        sync: false
      # Shadow log: follow listed flights even without viewers, and allow
      # downloading the log (npm run shadow:report -- <url> <token>).
      - key: SHADOW_ALWAYS_ON
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: WEB_DIST
        value: ../web/dist
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        value: https://flightradar.fun
      # adsb.fi speaks the same readsb API; used when adsb.lol throttles Render's IPs.
      - key: ADSB_FALLBACK_URL
        value: https://opendata.adsb.fi/api
      - key: DATA_DIR
        value: data
      # Limits against locking house capital (each market binds about
      # 28 ADA of the operator wallet): new markets per IP and hour, and
      # open markets at a time.
      - key: MARKET_REQUESTS_PER_HOUR
        value: "10"
      - key: MAX_OPEN_MARKETS
        value: "50"
